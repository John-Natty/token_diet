name: token-budget
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: git diff-tree --check -r HEAD
      - run: python -m tkn.audit . --check
      - name: artefacts locaux absents de l'index
        run: |
          if git ls-files | grep -E '(^|/)(\.venv|__pycache__|[^/]+\.egg-info)(/|$)|\.bak\.'; then
            echo "::error::des artefacts locaux sont suivis par Git"
            exit 1
          fi
      - name: fichiers auto-injectes sous le seuil
        run: |
          for f in AGENTS.md CLAUDE.md .cursorrules; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt 60 ]; then
              echo "::error file=$f::$f fait $n lignes (seuil 60)"
              exit 1
            fi
          done
